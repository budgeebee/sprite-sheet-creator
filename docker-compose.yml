version: '3.8'

services:
  sprite-sheet-creator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprite-sheet-creator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - sprite-network

networks:
  sprite-network:
    driver: bridge
